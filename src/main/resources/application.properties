server.port=8080

# ===== 回调接入网关配置（webhook.*）=====
# 请求时间戳允许的时钟偏差（秒），超过即判 TIMESTAMP_EXPIRED（防重放）
webhook.replay-window-seconds=300
# 业务处理失败时的最大投递尝试次数（含首次）
webhook.max-attempts=3
# 重试固定退避（毫秒）
webhook.retry-backoff-millis=50

# ===== 合作方：各自独立密钥与每分钟配额 =====
webhook.partners.acme.secret=acme-secret-key-2026
webhook.partners.acme.quota-per-minute=100
webhook.partners.globex.secret=globex-secret-key-2026
webhook.partners.globex.quota-per-minute=5
