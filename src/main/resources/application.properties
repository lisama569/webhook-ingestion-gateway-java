server.port=8080

# 签名时间戳容忍窗口（秒）
webhook.timestamp-tolerance-seconds=300
# 失败投递最大尝试次数（含首次）
webhook.max-retry-attempts=3
# 限流窗口长度（秒）
webhook.rate-window-seconds=60

# 合作方密钥与每窗口配额
webhook.partners.acme.secret=acme-secret-key
webhook.partners.acme.quota-per-window=100
webhook.partners.globex.secret=globex-secret-key
webhook.partners.globex.quota-per-window=50
